<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#4b7453" />
<title>You're offline — Study Planner</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Manrope, system-ui, sans-serif; background: #f9f6f1; color: #2c3338; padding: 24px; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #1d2126; color: #e8e6e1; } }
  img { width: 72px; height: 72px; }
  h1 { font-family: Sora, system-ui, sans-serif; font-size: 1.4rem; margin: 16px 0 8px; }
  p { max-width: 22rem; opacity: .8; line-height: 1.5; }
  button { margin-top: 16px; font: inherit; font-weight: 600; background: #4b7453; color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; min-height: 44px; cursor: pointer; }
  button:focus-visible { outline: 3px solid #9cc2a5; outline-offset: 2px; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Study Planner logo" />
    <h1>You're offline</h1>
    <p>Study Planner needs a connection to load this page. Your saved study data is safe in your account.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </main>
</body>
</html>
